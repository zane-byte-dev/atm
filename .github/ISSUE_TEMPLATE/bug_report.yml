name: Bug report
description: Report a reproducible ATM problem without uploading sensitive local data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach transcripts, databases, configuration, credentials, or unredacted exports.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of commands or steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ATM version
      placeholder: Output of atm version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Data safety
      options:
        - label: I reviewed this report and removed credentials, private messages, personal data, and company-confidential information.
          required: true
