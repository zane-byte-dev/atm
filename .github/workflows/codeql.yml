name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4.37.9
      - uses: github/codeql-action/analyze@v4.37.9
