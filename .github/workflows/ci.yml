name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Check Go and release configuration
        run: ./scripts/release-check.sh go

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Check development supervisor lifecycle
        run: ./scripts/release-check.sh dev

      - name: Check frontend and embedded binary
        run: ./scripts/release-check.sh web

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test and package native apps
        run: ./scripts/release-check.sh native
