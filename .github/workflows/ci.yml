name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build CLI without frontend assets
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app/web

      - name: Check frontend types
        run: npm run check --prefix app/web

      - name: Test frontend state handling
        run: npm run test --prefix app/web

      - name: Build frontend assets
        run: npm run build --prefix app/web

      - name: Build complete binary with embedded assets
        run: go build -trimpath -tags webui -o bin/atm-web-ci-check ./cmd/atm

  release-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Verify CLI, Web, macOS, migration, and release contracts
        run: ./scripts/release-check.sh
